name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r scripts/requirements-directories.txt -r scripts/requirements-browser.txt
      - name: Run offline unit and CLI tests
        working-directory: scripts
        run: python -B -X utf8 -m unittest discover -p "test_*.py" -v
